name: Build & Test TailUserspace

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build, Test & Package
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift & System Info
        run: |
          sw_vers
          swift --version

      - name: Install Tailscale
        run: brew install tailscale

      - name: Run Unit Tests
        run: make test

      - name: Build Release & Package Distribution Archive
        run: make dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TailUserspace-macOS
          path: |
            TailUserspace-macOS.zip
            tail-userspace-cli
          retention-days: 14
